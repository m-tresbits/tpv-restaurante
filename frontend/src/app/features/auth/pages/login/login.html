<form class="login" [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
  <header class="login__header">
    <p class="login__eyebrow">TPV RESTAURANTE</p>
    <h1 class="login__title">Acceso al terminal</h1>
  </header>

  <fieldset class="login__roles" aria-label="Selecciona tu rol">
    @for (role of roles; track role) {
      <button
        class="login__role"
        type="button"
        [class.login__role--selected]="selectedRole() === role"
        [attr.aria-pressed]="selectedRole() === role"
        [disabled]="isSubmitting()"
        (click)="selectRole(role)"
      >
        {{ role }}
      </button>
    }
  </fieldset>

  <label class="login__pin" [class.login__pin--error]="loginError()" for="pin">
    <span>PIN</span>
    <input
      id="pin"
      name="pin"
      formControlName="pin"
      inputmode="numeric"
      autocomplete="one-time-code"
      maxlength="4"
      pattern="[0-9]{4}"
      aria-describedby="pin-hint"
      (input)="formatPin($event)"
    />
  </label>

  <p id="pin-hint" class="login__hint">Introduce los 4 dígitos de acceso.</p>

  @if (loginError()) {
    <p class="login__error">{{ loginError() }}</p>
  }

  <button class="login__submit" type="submit" [disabled]="loginForm.invalid || isSubmitting()">
    {{ isSubmitting() ? 'Accediendo...' : 'Acceder' }}
  </button>
</form>
