<section class="login">
  <div class="login__card">
    <div class="login__header">
      <h1>TPV Restaurante</h1>
      <p>Acceso al sistema</p>
    </div>

    <div class="login__roles">
      <button
        type="button"
        class="login__role-button"
        [class.login__role-button--active]="selectedRole === 'camarero'"
        (click)="selectRole('camarero')"
      >
        Camarero
      </button>

      <button
        type="button"
        class="login__role-button"
        [class.login__role-button--active]="selectedRole === 'cocina'"
        (click)="selectRole('cocina')"
      >
        Cocina
      </button>

      <button
        type="button"
        class="login__role-button"
        [class.login__role-button--active]="selectedRole === 'admin'"
        (click)="selectRole('admin')"
      >
        Administrador
      </button>
    </div>

    <form class="login__form">
      <input type="password" inputmode="numeric" maxlength="4" placeholder="Código PIN" />

      <button type="button">Entrar</button>
    </form>
  </div>
</section>
